      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --paper: #f5f4ed;
        --paper-2: #efeee5;
        --ink: #0b0d0b;
        --muted: #52534e;
        --soft: #65655c;
        --rule: rgba(11, 13, 11, 0.12);
        --rule-strong: rgba(11, 13, 11, 0.25);
        --accent: #f7591f;
        --sans: "Geist", system-ui, sans-serif;
        --serif: "Instrument Serif", serif;
        --mono: "Geist Mono", ui-monospace, monospace;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--sans);
        background: var(--paper);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .topbar {
        padding: 1rem 1.25rem 0.625rem;
        border-bottom: 1px solid var(--rule);
        flex: 0 0 auto;
      }
      .title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 0.75rem;
        gap: 1rem;
      }
      .title-row h1 {
        font-family: var(--serif);
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: 1;
      }
      .title-row .meta {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .title-row .open-raw {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.06em;
        color: var(--muted);
        text-decoration: none;
        padding: 0.3rem 0.625rem;
        border: 1px solid var(--rule);
        border-radius: 4px;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .open-raw:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.375rem;
        margin-bottom: 0.5rem;
      }
      .tabs.variants {
        margin-bottom: 0;
        padding-top: 0.5rem;
        border-top: 1px solid var(--rule);
      }
      .tab {
        font-family: var(--sans);
        font-size: 0.8125rem;
        font-weight: 500;
        padding: 0.375rem 0.75rem;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--rule);
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.12s;
        letter-spacing: -0.005em;
      }
      .tab:hover {
        color: var(--ink);
        border-color: var(--rule-strong);
      }
      .tab:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .tab.active {
        background: var(--ink);
        color: var(--paper);
        border-color: var(--ink);
      }
      .tab .eyebrow {
        display: inline-block;
        margin-right: 0.25rem;
        font-family: var(--mono);
        font-size: 0.56rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: inherit;
        opacity: 0.5;
      }
      .tab.new::after {
        content: "NEW";
        display: inline-block;
        margin-left: 0.35rem;
        font-family: var(--mono);
        font-size: 0.54rem;
        letter-spacing: 0.12em;
        color: var(--accent);
        vertical-align: 1px;
      }
      .tab.active.new::after {
        color: var(--paper);
      }

      .lang-toggle {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.06em;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--rule);
        border-radius: 4px;
        padding: 0.3rem 0.625rem;
        cursor: pointer;
        transition:
          color 0.15s,
          border-color 0.15s,
          background 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
      }
      .lang-toggle:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      html[lang="zh-CN"] .tab.new::after {
        content: "新";
      }

      main {
        flex: 1 1 auto;
        position: relative;
        background: var(--paper-2);
        overflow: hidden;
      }
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--paper);
        display: block;
      }

      @media (max-width: 640px) {
        #type-tabs {
          flex-wrap: nowrap;
          overflow-x: auto;
          overscroll-behavior-inline: contain;
          padding-bottom: 0.25rem;
          scrollbar-width: thin;
        }
        #type-tabs .tab {
          flex: 0 0 auto;
        }
      }
    </style>

    <script>
      const state = { type: "architecture", variant: "" };
      const iframe = document.getElementById("preview");
      const openRaw = document.getElementById("open-raw");

      function update() {
        const activeType = [...document.querySelectorAll("#type-tabs .tab")].find(
          (tab) => tab.dataset.type === state.type,
        );
        const single = activeType && activeType.hasAttribute("data-single");
        const variantTabs = document.querySelectorAll("#variant-tabs .tab");
        if (single) state.variant = "";
        variantTabs.forEach((tab) => {
          tab.disabled = single && tab.dataset.variant !== "";
        });
        for (const [containerId, key] of [
          ["type-tabs", "type"],
          ["variant-tabs", "variant"],
        ]) {
          document.querySelectorAll(`#${containerId} .tab`).forEach((tab) => {
            const active = tab.dataset[key] === state[key];
            tab.classList.toggle("active", active);
            tab.setAttribute("aria-checked", String(active));
            tab.tabIndex = active ? 0 : -1;
          });
        }
        const src = `example-${state.type}${state.variant}.html`;
        iframe.src = src;
        openRaw.href = src;
        const selectedTabs = document.querySelectorAll('[role="radio"][aria-checked="true"]');
        iframe.setAttribute(
          "aria-labelledby",
          [...selectedTabs].map((tab) => tab.id).join(" "),
        );
      }

      function bindTabs(containerId, key) {
        const container = document.getElementById(containerId);
        const tabs = [...container.querySelectorAll(".tab")];
        tabs.forEach((tab, index) => {
          tab.id = `${containerId}-${index}`;
          tab.setAttribute("role", "radio");
          tab.setAttribute("aria-controls", "preview");
        });

        function activate(tab, focus = false) {
          state[key] = tab.dataset[key];
          update();
          if (focus) tab.focus();
        }

        container.addEventListener("click", (e) => {
          const btn = e.target.closest(".tab");
          if (!btn) return;
          activate(btn);
        });
        container.addEventListener("keydown", (e) => {
          const current = e.target.closest('[role="radio"]');
          if (!current || !container.contains(current)) return;
          const enabledTabs = tabs.filter((tab) => !tab.disabled);
          const index = enabledTabs.indexOf(current);
          let next;
          if (e.key === "ArrowRight" || e.key === "ArrowDown") {
            next = enabledTabs[(index + 1) % enabledTabs.length];
          }
          if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
            next = enabledTabs[(index - 1 + enabledTabs.length) % enabledTabs.length];
          }
          if (e.key === "Home") next = enabledTabs[0];
          if (e.key === "End") next = enabledTabs.at(-1);
          if (!next) return;
          e.preventDefault();
          activate(next, true);
        });
      }

      bindTabs("type-tabs", "type");
      bindTabs("variant-tabs", "variant");
      update();

      let currentLang =
        localStorage.getItem("diagram-design-lang") ||
        (navigator.language && navigator.language.startsWith("zh") ? "zh" : "en");

      function applyLanguage(lang) {
        currentLang = lang;
        localStorage.setItem("diagram-design-lang", lang);
        document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        document.title = I18N[lang].title;

        const metaEl = document.getElementById("gallery-meta");
        if (metaEl) metaEl.textContent = I18N[lang].meta;

        const iconsEl = document.getElementById("link-icons");
        if (iconsEl) iconsEl.textContent = I18N[lang].icons;

        const openRawEl = document.getElementById("open-raw");
        if (openRawEl) openRawEl.textContent = I18N[lang].openRaw;

        const btnTextEl = document.getElementById("lang-btn-text");
        if (btnTextEl) btnTextEl.textContent = I18N[lang].langBtn;

        const typeTabsCont = document.getElementById("type-tabs");
        if (typeTabsCont) typeTabsCont.setAttribute("aria-label", I18N[lang].typeAria);

        const varTabsCont = document.getElementById("variant-tabs");
        if (varTabsCont) varTabsCont.setAttribute("aria-label", I18N[lang].variantAria);

        document.querySelectorAll("#type-tabs .tab").forEach((tab) => {
          const t = tab.dataset.type;
          const eyebrow = tab.querySelector(".eyebrow");
          const label = I18N[lang].types[t] || I18N.en.types[t] || t;
          for (const node of Array.from(tab.childNodes)) {
            if (node !== eyebrow) node.remove();
          }
          tab.appendChild(document.createTextNode(label));
          tab.title = lang === "zh" ? (I18N.en.types[t] || "") : (I18N.zh.types[t] || "");
        });

        document.querySelectorAll("#variant-tabs .tab").forEach((tab) => {
          const v = tab.dataset.variant;
          if (I18N[lang].variants[v] !== undefined) {
            tab.textContent = I18N[lang].variants[v];
            tab.title = lang === "zh" ? (I18N.en.variants[v] || "") : (I18N.zh.variants[v] || "");
          }
        });
      }

      const langBtn = document.getElementById("lang-btn");
      if (langBtn) {
        langBtn.addEventListener("click", () => {
          applyLanguage(currentLang === "zh" ? "en" : "zh");
        });
      }

      applyLanguage(currentLang);
    </script>
